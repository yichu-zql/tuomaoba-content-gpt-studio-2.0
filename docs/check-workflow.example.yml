# 待获得 GitHub workflow 权限后，放入 .github/workflows/check.yml 启用。
name: Check content and application
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check.cjs
