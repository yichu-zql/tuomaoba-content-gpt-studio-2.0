name: Check content and application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node case-library/validate.cjs
      - run: node tests/check.cjs
      - run: node tests/service.cjs
      - run: node tests/libraries.cjs
